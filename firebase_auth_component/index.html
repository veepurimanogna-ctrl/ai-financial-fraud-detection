<!DOCTYPE html>
<html>
<head>
    <style>
      body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
      .google-btn {
        width: 100%;
        background-color: #FFFFFF;
        color: #000000;
        border: none;
        border-radius: 30px;
        padding: 12px 15px;
        font-weight: 800;
        font-size: 1.05rem;
        margin-top: 15px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: 'Inter', sans-serif;
        box-sizing: border-box;
      }
      .google-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(255,255,255,0.2);
      }
    </style>
    <script>
      // Streamlit Component Handshake Protocol
      function sendMessageToStreamlitClient(type, data) {
        const outData = Object.assign({
          isStreamlitMessage: true,
          type: type,
        }, data);
        window.parent.postMessage(outData, "*");
      }
      
      // Notify Streamlit that the component is fully loaded and set its height
      window.addEventListener('load', () => {
        sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});
        sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: 80});
      });
    </script>
</head>
<body>

    <button id="google-btn" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDHBw2mFGnJri3M6BKZmqVlCK1CYLLjfzY",
        authDomain: "aurevia-shield.firebaseapp.com",
        projectId: "aurevia-shield",
        storageBucket: "aurevia-shield.firebasestorage.app",
        messagingSenderId: "274600681544",
        appId: "1:274600681544:web:9add750eb1e92985acf87d",
        measurementId: "G-F34BVMQV74"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      document.getElementById('google-btn').addEventListener('click', () => {
        signInWithPopup(auth, provider)
          .then((result) => {
            const user = result.user;
            // Redirect the Streamlit parent window and pass the authentication state
            window.parent.location.href = window.parent.location.pathname + "?auth_success=true&email=" + encodeURIComponent(user.email);
          }).catch((error) => {
            console.error("Firebase Auth Error:", error);
            if (error.code === 'auth/unauthorized-domain') {
                alert("Authentication failed: Unauthorized domain.\n\nPlease add THIS EXACT DOMAIN to your Firebase Authorized Domains:\n\n" + window.location.hostname);
            } else {
                alert("Authentication failed: " + error.message);
            }
          });
      });
    </script>
</body>
</html>
